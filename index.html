<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Uzum Kartochka Studiyasi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Caveat:wght@700&family=Kaushan+Script&family=Onest:wght@400;500;600;700&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><link rel="stylesheet" href="/style.css"></head><body><header class="top">
  <div>
    <h1>Uzum Kartochka Studiyasi</h1>
    <p>Fon rasmini ChatGPT'dan yozuvsiz oling, yozuvlar va kartalarni shu yerda qo'ying. O'lcham: 1080×1440 (3:4).</p>
  </div>
  <div class="actions">
    <button class="btn primary" id="dlOne">Shu rasmni yuklab olish</button>
    <button class="btn" id="dlAll">Hammasini ZIP qilib olish</button>
  </div>
</header>

<div class="wrap">
  <section class="panel" id="aiPanel" aria-label="AI bilan yaratish">
    <h2>AI bilan yaratish — model nomini yozing, kartochka o'zi tuziladi</h2>
    <div class="ai-grid">
      <label>Mahsulot nomi va xususiyatlari<textarea id="aiInput" rows="2" placeholder='ASUS ExpertBook B1503CVA Intel Core 5 120U 16GB DDR5 512GB 15.6" Full HD Gentle Grey'></textarea></label>
      <label>Qo'shimcha izoh (ixtiyoriy)<input id="aiNotes" placeholder="Masalan: ofis xodimlari va talabalar uchun"></label>
      <label>Rasmlar soni<select id="aiCount"><option>4</option><option selected>5</option><option>6</option><option>8</option></select></label>
      <div class="btns"><button class="btn primary" id="aiGo">Kartochkani yaratish</button><button class="btn" id="aiStop" hidden>To'xtatish</button></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="aiGenImgs" hidden>Rasmlarni AI bilan yaratish</button>
      <button class="btn" id="aiAllPrompts">1. Barcha promptlarni nusxalash (ChatGPT uchun)</button>
      <label class="btn" id="aiPlaceLbl">2. ChatGPT rasmlarini yuklash — AI o'zi joylaydi<input type="file" id="aiPlace" accept="image/*" multiple hidden></label>
      <button class="btn" id="aiReview">3. AI tekshiruvi va tuzatish</button>
      <button class="btn ghost" id="aiUndo" hidden>Oxirgi AI o'zgarishini bekor qilish</button>
    </div>
    <p class="hint" id="aiStatus" aria-live="polite"></p>
    <div id="aiReport" hidden></div>
    <details id="listing" hidden><summary>Uzum uchun nom, tavsif va xususiyatlar (UZ / RU)</summary><div id="listingBody"></div></details>
  </section>
</div>

<main class="app">
  <section class="panel" id="brandPanel" aria-label="Brend sozlamalari"></section>

  <section id="stage" aria-label="Ko'rinish">
    <canvas id="cv" width="1080" height="1440"></canvas>
    <div class="strip" id="strip"></div>
  </section>

  <section class="panel" id="editorPanel" aria-label="Rasm muharriri"></section>
</main>

<div id="toast" hidden></div>
<div id="modal" hidden><div class="box"><div class="ed-top"><strong>Rasmlarni saqlash</strong><button class="btn sm" id="mClose">Yopish</button></div><div id="modalBody"></div></div></div>
<input type="file" id="loadJson" accept=".json,application/json" hidden><script src="/app1.js"></script><script src="/app2.js"></script><script src="/app3.js"></script><script src="/app4.js"></script><script src="/app5.js"></script><script src="/app6.js"></script></body></html>
